openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /risk-administration/references/{catalog}:
    parameters:
      - { name: catalog, in: path, required: true, schema: { $ref: "#/components/schemas/RiskReferenceCatalog" } }
    get:
      operationId: listRiskAdministrationReferences
      responses:
        "200":
          description: All active and retired reference choices for management
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RiskReference" }
    post:
      operationId: createRiskAdministrationReference
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskReferenceCreateInput" }
      responses:
        "201":
          description: Reference created and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskReferenceResponse" }
  /risk-administration/references/{catalog}/{code}:
    parameters:
      - { name: catalog, in: path, required: true, schema: { $ref: "#/components/schemas/RiskReferenceCatalog" } }
      - { name: code, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateRiskAdministrationReference
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskReferenceUpdateInput" }
      responses:
        "200":
          description: Reference updated, retired or reactivated without deleting historical references
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskReferenceResponse" }
  /risk-administration/departments:
    get:
      operationId: listRiskAdministrationDepartments
      responses:
        "200":
          description: Risk departments for authorized administration
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RiskAdministrationDepartment" }
    post:
      operationId: createRiskAdministrationDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskDepartmentCreateInput"
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskAdministrationDepartmentResponse" }
  /risk-administration/departments/{code}:
    patch:
      operationId: updateRiskAdministrationDepartment
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskDepartmentUpdateInput"
      responses:
        "200":
          description: Department name updated; stable code and existing references retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskAdministrationDepartmentResponse" }
  /client-ratings/options:
    get:
      operationId: getClientRatingOptions
      responses:
        "200":
          description: Client rating filters, source and access scope
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [ratings, reasons, total, source, scope, system_captured]
                    properties:
                      ratings: { type: array, items: { type: string } }
                      reasons: { type: array, items: { type: string } }
                      total: { type: integer }
                      source: { type: string }
                      scope: { type: string }
                      system_captured:
                        type: boolean
                        description: New classifications capture a system; older records may still have null.
  /client-ratings:
    get:
      operationId: listClientRatings
      parameters:
        - { name: search_by, in: query, schema: { type: string, enum: [proposer, policy] } }
        - { name: search, in: query, schema: { type: string, maxLength: 150 } }
        - { name: rating, in: query, schema: { type: string, enum: ["", Low, Medium, High] } }
        - { name: reason, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Paginated persisted client classifications
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [records, total, page, page_size]
                    properties:
                      records:
                        type: array
                        items:
                          type: object
                          required: [rating_id, file_no, policy_code, proposer, cover_type, system, risk_rating, reason, invoice_number, entered_by, entry_date]
                          properties:
                            rating_id: { type: integer }
                            file_no: { type: string }
                            policy_code: { type: string, nullable: true }
                            proposer: { type: string }
                            cover_type: { type: string, nullable: true }
                            system:
                              type: ["string", "null"]
                              description: Explicit saved originating system; unavailable on original records without one.
                            risk_rating: { type: string }
                            reason: { type: string }
                            invoice_number: { type: string, nullable: true }
                            entered_by: { type: string }
                            entry_date: { type: string, format: date-time, nullable: true }
                      total: { type: integer }
                      page: { type: integer }
                      page_size: { type: integer }
  /client-ratings/report:
    get:
      operationId: getClientRatingsReport
      parameters:
        - { name: search_by, in: query, schema: { type: string, enum: [proposer, policy] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: rating, in: query, schema: { type: string, enum: ["", Low, Medium, High] } }
        - { name: reason, in: query, schema: { type: string } }
      responses:
        "200":
          description: CSV export of all matching authorized records, up to 10000
          content:
            text/csv:
              schema: { type: string }
  /risk-register/import/preview:
    post:
      operationId: previewRiskRegisterImport
      tags: [Risk]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskImportSource" }
      responses:
        "200":
          description: Read-only validation of an insert-only departmental risk import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskImportPreviewResponse" }
  /risk-register/import/confirm:
    post:
      operationId: confirmRiskRegisterImport
      tags: [Risk]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskImportConfirmation" }
      responses:
        "201":
          description: All records and audit evidence inserted atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskImportResultResponse" }
  /risk-register/options:
    get:
      operationId: getRiskRegisterOptions
      responses:
        "200":
          description: Scoped risk workspace options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskOptionsResponse" }
  /risk-register/records:
    get:
      operationId: listRiskRegisterRecords
      parameters:
        - { name: access, in: query, schema: { type: string, enum: [view, update, review] }, description: Department role scope for the requested workspace }
        - { name: depart_code, in: query, schema: { type: string } }
        - { name: period_id, in: query, schema: { type: integer } }
        - { name: view, in: query, schema: { type: string, enum: [all, open, submitted, reviewed, signed, closed] } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Scoped risks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskRecordsResponse" }
    post:
      operationId: createRiskRegisterRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskRecordInput" }
      responses:
        "201":
          description: Created risk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskRecordResponse" }
  /risk-register/records/{riskCode}:
    parameters:
      - { name: riskCode, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRiskRegisterRecord
      responses:
        "200":
          description: Risk, mitigation actions, and append-only history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskDetailResponse" }
    put:
      operationId: updateRiskRegisterRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskAssessmentInput" }
      responses:
        "200":
          description: Saved assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskRecordResponse" }
  /risk-register/records/{riskCode}/root-causes:
    parameters:
      - { name: riskCode, in: path, required: true, schema: { type: string } }
    post:
      operationId: saveRiskRegisterRootCause
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskCauseInput" }
      responses:
        "200":
          description: Saved mitigation action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskMutationResponse" }
  /risk-register/workflow:
    post:
      operationId: decideRiskRegisterWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskWorkflowInput" }
      responses:
        "200":
          description: Department register decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskMutationResponse" }
  /risk-register/summary:
    get:
      operationId: getRiskRegisterSummary
      parameters:
        - { name: access, in: query, schema: { type: string, enum: [view, update, review] }, description: Department role scope for the requested workspace }
        - { name: period_id, in: query, schema: { type: integer } }
        - { name: depart_code, in: query, schema: { type: string } }
      responses:
        "200":
          description: Department register summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskSummaryResponse" }
  /risk-register/history:
    get:
      operationId: getRiskRegisterHistory
      parameters:
        - { name: period_id, in: query, schema: { type: integer } }
        - { name: depart_code, in: query, schema: { type: string } }
      responses:
        "200":
          description: Scoped historical register events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskHistoryResponse" }
  /risk-register/periods:
    post:
      operationId: openRiskRegisterPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskPeriodInput" }
      responses:
        "201":
          description: Reporting period opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskMutationResponse" }
  /risk-register/periods/{periodId}/close:
    parameters:
      - { name: periodId, in: path, required: true, schema: { type: integer } }
    post:
      operationId: closeRiskRegisterPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskCommentInput" }
      responses:
        "200":
          description: Signed-off reporting period closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskMutationResponse" }
  /risk-register/assignments:
    post:
      operationId: assignRiskRegisterTeam
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskAssignmentInput" }
      responses:
        "200":
          description: Champion and owner assignment saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskMutationResponse" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /medical-underwriting/files/{fileNo}/uploads:
    post:
      operationId: recordMedicalDocumentUpload
      parameters:
        - name: fileNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MedicalDocumentInput" }
      responses:
        "201":
          description: Private medical document saved; AML classifications require an approved originating system
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [upload_id]
                    properties:
                      upload_id: { type: integer }
        "400":
          description: Invalid document or classification metadata
        "403":
          description: Medical account or assigned-user permission required
  /business/aml/originating-systems:
    get:
      operationId: getAmlOriginatingSystems
      responses:
        "200":
          description: Authenticated staff catalog verified from the updated legacy AML writers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmlOriginatingSystemsResponse" }
  /business/allocated/{fileNo}/uploads:
    parameters:
      - name: fileNo
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listAllocatedDocumentUploads
      responses:
        "200":
          description: Private document metadata for the assigned user or SuperAdmin
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AllocatedDocumentUpload" }
        "403":
          description: Not assigned to this file
    post:
      operationId: recordAllocatedDocumentUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllocatedDocumentInput" }
      responses:
        "201":
          description: Document classification saved without changing original uploads
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [upload_id]
                    properties:
                      upload_id: { type: integer }
        "400":
          description: Invalid document metadata or unapproved originating system
        "403":
          description: Not assigned to this file
        "409":
          description: Allocation changed before the upload could be saved
components:
  schemas:
    RiskReferenceCatalog:
      type: string
      enum: [action-statuses, categories, control-effectiveness, objectives, exposure, impact, likelihood, reasons]
    RiskReference:
      type: object
      required: [code, label, description, rating, depart_code, is_active]
      properties:
        code: { type: string }
        label: { type: string }
        description: { type: ["string", "null"] }
        rating: { type: ["number", "null"] }
        depart_code: { type: ["string", "null"] }
        is_active: { type: boolean }
        risk_type: { type: ["string", "null"], enum: [I, R, null] }
        minimum: { type: ["number", "null"] }
        maximum: { type: ["number", "null"] }
        rate_label: { type: ["string", "null"] }
    RiskReferenceResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data: { $ref: "#/components/schemas/RiskReference" }
    RiskReferenceCreateInput:
      type: object
      required: [code, label]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        label: { type: string, minLength: 1, maxLength: 1000 }
        description: { type: ["string", "null"], maxLength: 5000 }
        rating: { type: number, minimum: 0, maximum: 100, description: Fraction for control-effectiveness and likelihood; impact factor up to 100 for impact }
        depart_code: { type: string, description: Required active department for objectives }
        risk_type: { type: string, enum: [I, R] }
        minimum: { type: number, minimum: 0, maximum: 100 }
        maximum: { type: number, minimum: 0, maximum: 100 }
        rate_label: { type: string, minLength: 1, maxLength: 50 }
    RiskReferenceUpdateInput:
      type: object
      required: [label, is_active]
      properties:
        label: { type: string, minLength: 1, maxLength: 1000 }
        description: { type: ["string", "null"], maxLength: 5000 }
        rating: { type: number, minimum: 0, maximum: 100 }
        is_active: { type: boolean }
        risk_type: { type: string, enum: [I, R] }
        minimum: { type: number, minimum: 0, maximum: 100 }
        maximum: { type: number, minimum: 0, maximum: 100 }
        rate_label: { type: string, minLength: 1, maxLength: 50 }
        depart_code: { type: string, description: Required for objectives; selects the immutable department/code pair, never moves an objective }
        expected:
          $ref: "#/components/schemas/RiskReference"
          description: Last loaded reference; reject stale edits or status changes rather than overwriting another administrator
    RiskAdministrationDepartment:
      type: object
      required: [depart_code, depart_name, is_active]
      properties:
        depart_code: { type: string }
        depart_name: { type: string }
        is_active: { type: boolean }
    RiskAdministrationDepartmentResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data: { $ref: "#/components/schemas/RiskAdministrationDepartment" }
    RiskImportSource:
      type: object
      additionalProperties: false
      required: [source_name, source_text]
      properties:
        source_name: { type: string, minLength: 1, maxLength: 200 }
        source_text: { type: string, minLength: 1, maxLength: 61440 }
    RiskImportConfirmation:
      allOf:
        - { $ref: "#/components/schemas/RiskImportSource" }
        - type: object
          required: [preview_token, environment, confirm]
          properties:
            preview_token: { type: string, minLength: 1, maxLength: 2000 }
            environment: { type: string, minLength: 1, maxLength: 200 }
            confirm: { type: boolean, enum: [true] }
    RiskImportPreviewRow:
      type: object
      required: [row, legacy_risk_code, depart_code, risk_title, errors, warnings]
      properties:
        row: { type: integer }
        legacy_risk_code: { type: string }
        depart_code: { type: string }
        risk_title: { type: string }
        period_id: { type: integer }
        inherent: { type: number }
        residual: { type: number }
        errors: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
    RiskImportPreviewResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [environment, valid, rows, errors]
          properties:
            environment: { type: string }
            valid: { type: boolean }
            rows: { type: array, items: { $ref: "#/components/schemas/RiskImportPreviewRow" } }
            errors: { type: array, items: { type: string } }
            preview_token: { type: string }
            expires_at: { type: string, format: date-time }
    RiskImportResultResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [environment, imported, risk_codes]
          properties:
            environment: { type: string }
            imported: { type: integer }
            risk_codes: { type: array, items: { type: string } }
    RiskRecordInput:
      type: object
      required: [depart_code, period_id, objective_code, risk_title, risk_description, risk_category, risk_consequence]
      properties:
        depart_code: { type: string }
        period_id: { type: integer }
        objective_code: { type: string }
        risk_title: { type: string }
        risk_description: { type: string }
        risk_category: { type: string }
        risk_consequence: { type: string }
    RiskAssessmentInput:
      allOf:
        - { $ref: "#/components/schemas/RiskRecordInput" }
        - type: object
          required: [i_rate, l_rate, control_effectiveness, expected_updated_at, comments]
          properties:
            i_rate: { type: number, exclusiveMinimum: 0, maximum: 100 }
            l_rate: { type: number, exclusiveMinimum: 0, maximum: 100 }
            control_effectiveness: { type: number, minimum: 0, maximum: 1 }
            current_contr: { type: string }
            desired_contr_effe: { type: string }
            expected_updated_at: { type: string, format: date-time }
            comments: { type: string }
    RiskCauseInput:
      type: object
      required: [root_cause, mitigations, due_date, action_owner, action_status, expected_updated_at]
      properties:
        root_id: { type: integer }
        root_cause: { type: string }
        current_contr: { type: string }
        mitigations: { type: string }
        due_date: { type: string, format: date }
        action_owner: { type: string }
        action_status:
          type: string
          minLength: 1
          maxLength: 50
          description: Active status from RiskOptionsResponse.action_statuses. An existing retired status can be retained unchanged.
        expected_updated_at: { type: string, format: date-time }
    RiskWorkflowInput:
      type: object
      required: [depart_code, period_id, action, comments]
      properties:
        depart_code: { type: string }
        period_id: { type: integer }
        action: { type: string, enum: [SUBMIT, REVIEW, RETURN, SIGN_OFF, CLOSE, REOPEN, PROCESS] }
        comments: { type: string }
    RiskPeriodInput:
      type: object
      required: [period_from, period_to]
      properties:
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        source_period_id: { type: integer }
    RiskCommentInput:
      type: object
      required: [comments]
      properties:
        comments: { type: string }
    RiskAssignmentInput:
      type: object
      required: [depart_code, champion_username, owner_username]
      properties:
        depart_code: { type: string }
        champion_username: { type: string }
        owner_username: { type: string }
    RiskRecord:
      type: object
      required: [risk_code, depart_code, period_id, risk_title, updated_at, workflow_status]
      properties:
        risk_code: { type: string }
        depart_code: { type: string }
        depart_name: { type: string }
        period_id: { type: integer }
        period_from: { type: string }
        period_to: { type: string }
        objective_code: { type: [string, "null"] }
        risk_title: { type: string }
        risk_description: { type: [string, "null"] }
        risk_category: { type: [string, "null"] }
        category_name: { type: [string, "null"] }
        risk_consequence: { type: [string, "null"] }
        i_rate: { type: [string, "null"] }
        l_rate: { type: [string, "null"] }
        perceived_rate: { type: [string, "null"] }
        perceived_contr_eff: { type: [string, "null"] }
        i_risk_exposure: { type: [string, "null"] }
        r_risk_exposure: { type: [string, "null"] }
        current_contr: { type: [string, "null"] }
        desired_contr_effe: { type: [string, "null"] }
        assessment_updated: { type: boolean }
        completed_action_count: { type: integer }
        is_active: { type: boolean }
        updated_at: { type: string, format: date-time }
        workflow_status: { type: string }
        can_edit: { type: boolean }
    RiskRootCause:
      type: object
      required: [root_id, root_cause, action_status]
      properties:
        root_id: { type: integer }
        root_cause: { type: string }
        current_contr: { type: [string, "null"] }
        mitigations: { type: [string, "null"] }
        due_date: { type: [string, "null"] }
        action_owner: { type: [string, "null"] }
        action_status: { type: string }
    RiskHistoryEvent:
      type: object
      required: [history_id, depart_code, action, actor, comments, created_at]
      properties:
        history_id: { type: string }
        risk_code: { type: [string, "null"] }
        depart_code: { type: [string, "null"] }
        period_id: { type: [integer, "null"] }
        action: { type: string }
        actor: { type: string }
        comments: { type: string }
        snapshot: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    RiskLookup:
      type: object
      additionalProperties: true
      properties:
        depart_code: { type: string }
        depart_name: { type: string }
        obj_code: { type: string }
        obj_name: { type: string }
        category_code: { type: string }
        category_name: { type: string }
        username: { type: string }
        employee_name: { type: string }
        champion_username: { type: [string, "null"] }
        owner_username: { type: [string, "null"] }
        period_id: { type: integer }
        period_from: { type: string }
        period_to: { type: string }
        status: { type: string }
    RiskDepartmentCreateInput:
      type: object
      required: [depart_code, depart_name]
      properties:
        depart_code: { type: string, maxLength: 20 }
        depart_name: { type: string, maxLength: 100 }
    RiskDepartmentUpdateInput:
      type: object
      required: [depart_name]
      properties:
        depart_name: { type: string, maxLength: 100 }
    RiskActionStatus:
      type: object
      required: [code, status, description]
      properties:
        code: { type: string }
        status: { type: string }
        description: { type: [string, "null"] }
    RiskControlEffectiveness:
      type: object
      required: [eff_factor, qual_criteria, rating]
      properties:
        eff_factor: { type: string }
        qual_criteria: { type: string }
        rating: { type: number, minimum: 0, maximum: 1 }
    RiskImpactFactor:
      type: object
      required: [code, label, factor, rate]
      properties:
        code: { type: string }
        label: { type: string }
        factor: { type: number }
        rate: { type: string }
    RiskLikelihoodFactor:
      type: object
      required: [code, label, factor, criteria]
      properties:
        code: { type: string }
        label: { type: string }
        factor: { type: number }
        criteria: { type: string }
    RiskExposureBand:
      type: object
      required: [risk_type, level, minimum, maximum, description]
      properties:
        risk_type: { type: string, enum: [I, R] }
        level: { type: string }
        minimum: { type: number }
        maximum: { type: number }
        description: { type: string }
    RiskOptionsResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [actor, departments, categories, objectives, periods, staff, assignments, action_statuses, control_effectiveness, impact_factors, likelihood_factors, exposure_bands]
          properties:
            actor:
              type: object
              required: [username, can_manage, champion_departments, owner_departments]
              properties:
                username: { type: string }
                can_manage: { type: boolean }
                champion_departments: { type: array, items: { type: string } }
                owner_departments: { type: array, items: { type: string } }
            departments: { type: array, items: { $ref: "#/components/schemas/RiskLookup" } }
            categories: { type: array, items: { $ref: "#/components/schemas/RiskLookup" } }
            objectives: { type: array, items: { $ref: "#/components/schemas/RiskLookup" } }
            periods: { type: array, items: { $ref: "#/components/schemas/RiskLookup" } }
            staff: { type: array, items: { $ref: "#/components/schemas/RiskLookup" } }
            assignments: { type: array, items: { $ref: "#/components/schemas/RiskLookup" } }
            action_statuses: { type: array, items: { $ref: "#/components/schemas/RiskActionStatus" } }
            control_effectiveness: { type: array, items: { $ref: "#/components/schemas/RiskControlEffectiveness" } }
            impact_factors: { type: array, items: { $ref: "#/components/schemas/RiskImpactFactor" } }
            likelihood_factors: { type: array, items: { $ref: "#/components/schemas/RiskLikelihoodFactor" } }
            exposure_bands: { type: array, items: { $ref: "#/components/schemas/RiskExposureBand" } }
    RiskRecordsResponse:
      type: object
      required: [ok, data, totals]
      properties:
        ok: { type: boolean }
        data: { type: array, items: { $ref: "#/components/schemas/RiskRecord" } }
        totals:
          type: object
          description: Counts across the full authorized filtered scope, before the 500-record display limit.
          required: [active_risks, assessed_risks]
          properties:
            active_risks: { type: integer, minimum: 0 }
            assessed_risks: { type: integer, minimum: 0 }
    RiskRecordResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data: { $ref: "#/components/schemas/RiskRecord" }
    RiskDetailResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [risk, root_causes, history]
          properties:
            risk: { $ref: "#/components/schemas/RiskRecord" }
            root_causes: { type: array, items: { $ref: "#/components/schemas/RiskRootCause" } }
            history: { type: array, items: { $ref: "#/components/schemas/RiskHistoryEvent" } }
    RiskDepartmentSummary:
      type: object
      additionalProperties: true
      required: [depart_code, depart_name, total_risks, workflow_status]
      properties:
        depart_code: { type: string }
        depart_name: { type: string }
        total_risks: { type: integer }
        assessed_risks: { type: integer }
        avg_exposure: { type: [string, "null"] }
        max_exposure: { type: [string, "null"] }
        open_actions: { type: integer }
        overdue_actions: { type: integer }
        workflow_status: { type: string }
        period_id: { type: integer }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
    RiskSummaryResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data: { type: array, items: { $ref: "#/components/schemas/RiskDepartmentSummary" } }
    RiskHistoryResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data: { type: array, items: { $ref: "#/components/schemas/RiskHistoryEvent" } }
    RiskMutationResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        data: { type: object, additionalProperties: true }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MedicalDocumentInput:
      allOf:
        - { $ref: "#/components/schemas/AllocatedDocumentInput" }
        - type: object
          required: [mime_type]
          properties:
            mime_type: { type: string, maxLength: 200 }
    AmlOriginatingSystemsResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean }
        data:
          type: object
          required: [systems, source]
          properties:
            source: { type: string }
            systems:
              type: array
              items: { $ref: "#/components/schemas/AmlOriginatingSystemOption" }
    AmlOriginatingSystemOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string, enum: [eOx, AIMS] }
        label: { type: string }
    AllocatedDocumentInput:
      type: object
      required: [req_id, filename, filesize, storage_key]
      description: Dedicated AML risk documents require rate, reason and originating_system. AML Report proof-only uploads do not; any new optional classification requires all three. Existing saved records are not changed.
      properties:
        req_id: { type: integer }
        filename: { type: string }
        filesize: { type: integer, minimum: 1, maximum: 10485760 }
        mime_type: { type: string }
        storage_key: { type: string }
        invoice_no: { type: string, maxLength: 25 }
        amount: { type: string }
        policy_code: { type: string, maxLength: 100 }
        risk_rate: { type: string, enum: [Low, High, Medium] }
        risk_reason: { type: string }
        originating_system: { type: string, enum: [eOx, AIMS] }
    AllocatedDocumentUpload:
      type: object
      required: [upload_id, req_id, filename, filesize, mime_type, storage_key, uploaded_by, uploaded_at, invoice_no, amount, policy_code, risk_rate, risk_reason, originating_system]
      properties:
        upload_id: { type: integer }
        req_id: { type: ["integer", "null"] }
        filename: { type: string }
        filesize: { type: ["integer", "null"] }
        mime_type: { type: ["string", "null"] }
        storage_key: { type: string }
        uploaded_by: { type: string }
        uploaded_at: { type: string, format: date-time }
        invoice_no: { type: ["string", "null"] }
        amount: { type: ["number", "null"] }
        policy_code: { type: ["string", "null"] }
        risk_rate: { type: ["string", "null"] }
        risk_reason: { type: ["string", "null"] }
        originating_system: { type: ["string", "null"] }
