openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /gi-structure:
    get:
      operationId: getGiStructure
      responses:
        "200":
          description: GI setup and Medical unit mapping snapshot for authorised administrators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiStructureSnapshot" }
  /gi-structure/nodes:
    post:
      operationId: saveGiStructureNode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiNodeInput" }
      responses:
        "200":
          description: GI hierarchy entry saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganisationAssignmentResult" }
  /gi-structure/managers:
    post:
      operationId: saveGiManager
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiManagerInput" }
      responses:
        "200":
          description: GI category enrollment saved without modifying the MIS account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganisationAssignmentResult" }
  /gi-structure/mappings:
    post:
      operationId: saveGiMedicalMappings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiMappingInput" }
      responses:
        "200":
          description: Selected Medical units mapped atomically to one GI unit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganisationAssignmentResult" }
  /gi-structure/mappings/remove:
    post:
      operationId: removeGiMedicalMapping
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiMappingRemoval" }
      responses:
        "200":
          description: Current mapping removed; history retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganisationAssignmentResult" }
  /gi-structure/history:
    get:
      operationId: getGiStructureHistory
      parameters:
        - { name: entity_type, in: query, required: true, schema: { type: string, enum: [NODE, MANAGER, MAPPING] } }
        - { name: entity_key, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 50 } }
      responses:
        "200":
          description: Latest 100 recorded changes with preserved before and after details
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GiStructureEvent" }
  /organisation:
    get:
      operationId: getOrganisation
      responses:
        "200":
          description: Authorised hierarchy and setup choices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganisationSnapshot" }
  /organisation/sources/{id}/manager:
    post:
      operationId: reassignOrganisationSourceManager
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganisationSourceManagerInput" }
      responses:
        "200":
          description: Pending setup manager reassigned with audit history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganisationAssignmentResult" }
  /organisation/agents:
    get:
      operationId: getOrganisationAgents
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: node_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: unmapped, in: query, schema: { type: boolean } }
        - { name: as_of, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Scoped agent hierarchy report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganisationAgentList" }
  /organisation/agents/{code}/unit:
    post:
      operationId: assignOrganisationAgent
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganisationAssignmentInput" }
      responses:
        "200":
          description: Assignment approved and recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganisationAssignmentResult" }
  /organisation/agents/{code}/history:
    get:
      operationId: getOrganisationAgentHistory
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Immutable unit assignment history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OrganisationAssignment" } }
  /admin/sales-structure/manager-mappings:
    get:
      operationId: getSalesManagerMappings
      responses:
        "200":
          description: Organizational hierarchy, eligible MIS users and current team manager assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesManagerMappingSnapshot" }
    post:
      operationId: saveSalesManagerMapping
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesManagerMappingInput" }
      responses:
        "200":
          description: Manager assigned, replaced or unassigned without changing account permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesTeamManagerAssignment" }
  /admin/sales-structure/manager-mappings/history:
    get:
      operationId: getSalesManagerMappingHistory
      parameters:
        - { name: catalog, in: query, required: true, schema: { $ref: "#/components/schemas/SalesMappingCatalog" } }
        - { name: organization_code, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 50 } }
      responses:
        "200":
          description: Retained history for a team's manager assignments
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SalesManagerMappingEvent" } }
  /admin/sales-structure/catalogs:
    get:
      operationId: getSalesCatalogs
      responses:
        "200":
          description: Administrator-only enrollment definitions, records and mapping choices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesCatalogSnapshot" }
  /admin/sales-structure/catalogs/{catalog}:
    parameters:
      - { name: catalog, in: path, required: true, schema: { type: string } }
    post:
      operationId: createSalesCatalogEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesCatalogInput" }
      responses:
        "201":
          description: Catalog enrollment saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesSetupSaved" }
  /admin/sales-structure/catalogs/{catalog}/{id}:
    parameters:
      - { name: catalog, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: updateSalesCatalogEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesCatalogUpdate" }
      responses:
        "200":
          description: Catalog enrollment updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesSetupSaved" }
  /admin/sales-structure:
    get:
      operationId: getSalesStructure
      responses:
        "200":
          description: Administrator-only sales hierarchy, manager enrollments and eligible staff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesStructure" }
  /admin/sales-structure/nodes:
    post:
      operationId: createSalesStructureNode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesNodeInput" }
      responses:
        "201":
          description: Structure category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesSetupSaved" }
  /admin/sales-structure/nodes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: updateSalesStructureNode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesNodeUpdate" }
      responses:
        "200":
          description: Structure category updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesSetupSaved" }
  /admin/sales-structure/managers:
    post:
      operationId: enrollSalesManager
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesManagerInput" }
      responses:
        "201":
          description: Existing user enrolled without changing their login profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesSetupSaved" }
  /admin/sales-structure/managers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      operationId: updateSalesManagerEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesManagerUpdate" }
      responses:
        "200":
          description: Enrollment activated or deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesSetupSaved" }
  /intermediary/import:
    post:
      operationId: importIntermediaries
      responses:
        "200":
          description: Core agents pulled into the MIS setup queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntermediaryImportResult" }
  /intermediary/options:
    get:
      operationId: getIntermediaryOptions
      responses:
        "200":
          description: Authorized agent-management options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntermediaryOptions" }
  /intermediary/agents:
    get:
      operationId: listIntermediaries
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: search_by, in: query, schema: { type: string, enum: [all, name, agent_code, payroll] } }
        - { name: status, in: query, schema: { type: string } }
        - { name: agent_type, in: query, schema: { type: string } }
        - { name: registration_status, in: query, schema: { type: string, enum: [PENDING, COMPLETED] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntermediaryList" }
  /intermediary/agents/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
    get:
      operationId: getIntermediary
      responses:
        "200":
          description: Agent detail and retained history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntermediaryDetail" }
    patch:
      operationId: updateIntermediary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntermediaryInput" }
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntermediaryDetail" }
  /intermediary/agents/{code}/actions:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
    post:
      operationId: actionIntermediary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntermediaryActionInput" }
      responses:
        "200":
          description: Action saved with audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntermediaryDetail" }
  /intermediary/agents/{code}/uploads:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
    post:
      operationId: requestIntermediaryUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntermediaryUploadInput" }
      responses:
        "200":
          description: Owned upload ticket
          content:
            application/json:
              schema:
                type: object
                required: [document_id, upload_url]
                properties:
                  document_id: { type: integer }
                  upload_url: { type: string }
  /intermediary/agents/{code}/documents/{id}/confirm:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: confirmIntermediaryUpload
      responses:
        "200":
          description: Uploaded bytes confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntermediaryDetail" }
  /intermediary/agents/{code}/documents/{id}/download:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: downloadIntermediaryDocument
      responses:
        "200":
          description: Authorized attachment download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /risk-administration/references/{catalog}:
    parameters:
      - { name: catalog, in: path, required: true, schema: { $ref: "#/components/schemas/RiskReferenceCatalog" } }
    get:
      operationId: listRiskAdministrationReferences
      responses:
        "200":
          description: All active and retired reference choices for management
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RiskReference" }
    post:
      operationId: createRiskAdministrationReference
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskReferenceCreateInput" }
      responses:
        "201":
          description: Reference created and audited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskReferenceResponse" }
  /risk-administration/references/{catalog}/{code}:
    parameters:
      - { name: catalog, in: path, required: true, schema: { $ref: "#/components/schemas/RiskReferenceCatalog" } }
      - { name: code, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateRiskAdministrationReference
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskReferenceUpdateInput" }
      responses:
        "200":
          description: Reference updated, retired or reactivated without deleting historical references
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskReferenceResponse" }
  /risk-administration/departments:
    get:
      operationId: listRiskAdministrationDepartments
      responses:
        "200":
          description: Risk departments for authorized administration
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RiskAdministrationDepartment" }
    post:
      operationId: createRiskAdministrationDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskDepartmentCreateInput"
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskAdministrationDepartmentResponse" }
  /risk-administration/departments/{code}:
    patch:
      operationId: updateRiskAdministrationDepartment
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskDepartmentUpdateInput"
      responses:
        "200":
          description: Department name updated; stable code and existing references retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskAdministrationDepartmentResponse" }
  /client-ratings/options:
    get:
      operationId: getClientRatingOptions
      responses:
        "200":
          description: Client rating filters, source and access scope
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [ratings, reasons, total, source, scope, system_captured]
                    properties:
                      ratings: { type: array, items: { type: string } }
                      reasons: { type: array, items: { type: string } }
                      total: { type: integer }
                      source: { type: string }
                      scope: { type: string }
                      system_captured:
                        type: boolean
                        description: New classifications capture a system; older records may still have null.
  /client-ratings:
    get:
      operationId: listClientRatings
      parameters:
        - { name: search_by, in: query, schema: { type: string, enum: [proposer, policy] } }
        - { name: search, in: query, schema: { type: string, maxLength: 150 } }
        - { name: rating, in: query, schema: { type: string, enum: ["", Low, Medium, High] } }
        - { name: reason, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Paginated persisted client classifications
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [records, total, page, page_size]
                    properties:
                      records:
                        type: array
                        items:
                          type: object
                          required: [rating_id, file_no, policy_code, proposer, cover_type, system, risk_rating, reason, invoice_number, entered_by, entry_date]
                          properties:
                            rating_id: { type: integer }
                            file_no: { type: string }
                            policy_code: { type: string, nullable: true }
                            proposer: { type: string }
                            cover_type: { type: string, nullable: true }
                            system:
                              type: ["string", "null"]
                              description: Explicit saved originating system; unavailable on original records without one.
                            risk_rating: { type: string }
                            reason: { type: string }
                            invoice_number: { type: string, nullable: true }
                            entered_by: { type: string }
                            entry_date: { type: string, format: date-time, nullable: true }
                      total: { type: integer }
                      page: { type: integer }
                      page_size: { type: integer }
  /client-ratings/report:
    get:
      operationId: getClientRatingsReport
      parameters:
        - { name: search_by, in: query, schema: { type: string, enum: [proposer, policy] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: rating, in: query, schema: { type: string, enum: ["", Low, Medium, High] } }
        - { name: reason, in: query, schema: { type: string } }
      responses:
        "200":
          description: CSV export of all matching authorized records, up to 10000
          content:
            text/csv:
              schema: { type: string }
  /risk-register/import/preview:
    post:
      operationId: previewRiskRegisterImport
      tags: [Risk]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskImportSource" }
      responses:
        "200":
          description: Read-only validation of an insert-only departmental risk import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskImportPreviewResponse" }
  /risk-register/import/confirm:
    post:
      operationId: confirmRiskRegisterImport
      tags: [Risk]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskImportConfirmation" }
      responses:
        "201":
          description: All records and audit evidence inserted atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskImportResultResponse" }
  /risk-register/options:
    get:
      operationId: getRiskRegisterOptions
      responses:
        "200":
          description: Scoped risk workspace options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskOptionsResponse" }
  /risk-register/readiness/{departCode}/{periodId}:
    get:
      operationId: getRiskRegisterReadiness
      description: Submission readiness for one authorized department and reporting period, across all active risks without pagination.
      parameters:
        - { name: departCode, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 50 } }
        - { name: periodId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Complete register readiness counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskReadinessResponse" }
  /risk-register/records:
    get:
      operationId: listRiskRegisterRecords
      parameters:
        - { name: access, in: query, schema: { type: string, enum: [view, update, review] }, description: Department role scope for the requested workspace }
        - { name: depart_code, in: query, schema: { type: string } }
        - { name: period_id, in: query, schema: { type: integer } }
        - { name: view, in: query, schema: { type: string, enum: [all, open, pending_assessment, submitted, reviewed, signed, closed] } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Scoped risks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskRecordsResponse" }
    post:
      operationId: createRiskRegisterRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskRecordInput" }
      responses:
        "201":
          description: Created risk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskRecordResponse" }
  /risk-register/records/{riskCode}:
    parameters:
      - { name: riskCode, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRiskRegisterRecord
      responses:
        "200":
          description: Risk, mitigation actions, and append-only history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskDetailResponse" }
    put:
      operationId: updateRiskRegisterRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskAssessmentInput" }
      responses:
        "200":
          description: Saved assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskRecordResponse" }
  /risk-register/records/{riskCode}/root-causes:
    parameters:
      - { name: riskCode, in: path, required: true, schema: { type: string } }
    post:
      operationId: saveRiskRegisterRootCause
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskCauseInput" }
      responses:
        "200":
          description: Saved mitigation action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskMutationResponse" }
  /risk-register/workflow/reopen-scope:
    get:
      operationId: getRiskRegisterReopenScope
      tags: [RiskRegister]
      parameters:
        - { name: depart_code, in: query, required: true, schema: { type: string } }
        - { name: period_id, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Current selected-department reopening scope; management only.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    $ref: "#/components/schemas/RiskReopenScope"
  /risk-register/workflow/reminder:
    post:
      operationId: sendRiskWorkflowReminder
      tags: [RiskRegister]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskReminderInput" }
      responses:
        "200":
          description: Provider acceptance results for the current pending users; not inbox delivery confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskReminderResponse" }
        "409":
          description: Period or workflow changed, or recipients are missing
        "429":
          description: A reminder was already attempted in the last ten minutes
  /risk-register/workflow:
    post:
      operationId: decideRiskRegisterWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskWorkflowInput" }
      responses:
        "200":
          description: Department register decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskMutationResponse" }
  /risk-register/analytics:
    get:
      operationId: getRiskAnalytics
      tags: [RiskRegister]
      parameters:
        - { name: depart_code, in: query, schema: { type: string } }
        - { name: period_id, in: query, schema: { type: integer } }
        - { name: population, in: query, schema: { type: string, enum: [open, all], default: open } }
      responses:
        "200":
          description: Complete role-scoped risk analytics using saved assessment snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskAnalyticsResponse" }
  /risk-register/summary:
    get:
      operationId: getRiskRegisterSummary
      parameters:
        - { name: access, in: query, schema: { type: string, enum: [view, update, review] }, description: Department role scope for the requested workspace }
        - { name: period_id, in: query, schema: { type: integer } }
        - { name: depart_code, in: query, schema: { type: string } }
        - { name: include_pending, in: query, schema: { type: boolean }, description: Include responsible users and reminder readiness for workflow status }
      responses:
        "200":
          description: Department register summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskSummaryResponse" }
  /risk-register/history:
    get:
      operationId: getRiskRegisterHistory
      parameters:
        - { name: period_id, in: query, schema: { type: integer } }
        - { name: depart_code, in: query, schema: { type: string } }
      responses:
        "200":
          description: Scoped historical register events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskHistoryResponse" }
  /risk-register/periods:
    post:
      operationId: openRiskRegisterPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskPeriodInput" }
      responses:
        "201":
          description: Reporting period opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskMutationResponse" }
  /risk-register/closed-registers:
    get:
      operationId: listClosedRiskRegisters
      parameters:
        - { name: depart_code, in: query, schema: { type: string } }
        - { name: period_id, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Closed departmental registers, including previous-period history
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data: { type: array, items: { $ref: "#/components/schemas/ClosedRiskRegister" } }
  /risk-register/closed-registers/{departCode}/open:
    parameters:
      - { name: departCode, in: path, required: true, schema: { type: string } }
    post:
      operationId: openDepartmentRiskCycle
      description: Start a new department cycle in a later open period. Preserve the closed source register and every previous risk/status as history. Carry only ongoing active risks, with all their action plans, for fresh assessment.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenDepartmentRiskCycleInput" }
      responses:
        "200":
          description: New department cycle opened; previous register retained
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [depart_code, source_period_id, target_period_id, carried_risks, historical_risks, status]
                    properties:
                      depart_code: { type: string }
                      source_period_id: { type: integer }
                      target_period_id: { type: integer }
                      carried_risks: { type: integer }
                      historical_risks: { type: integer }
                      status: { type: string }
                      notification:
                        type: object
                        required: [queued, email_status]
                        properties:
                          queued: { type: integer }
                          email_status: { type: string }
  /risk-register/historical-risks:
    get:
      operationId: listHistoricalDepartmentRisks
      parameters:
        - { name: depart_code, in: query, required: true, schema: { type: string } }
        - { name: period_id, in: query, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Paginated read-only previous-period risks and recorded statuses
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [records, total, page, page_size]
                    properties:
                      records: { type: array, items: { $ref: "#/components/schemas/RiskRecord" } }
                      total: { type: integer }
                      page: { type: integer }
                      page_size: { type: integer }
  /risk-register/periods/{periodId}/close:
    parameters:
      - { name: periodId, in: path, required: true, schema: { type: integer } }
    post:
      operationId: closeRiskRegisterPeriod
      description: Close all Signed-OFF registered active departments in the selected period. Unsigned registers remain unchanged and keep the shared period open. Closed registers are available on Open Register.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskCommentInput" }
      responses:
        "200":
          description: Signed-off reporting period closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskMutationResponse" }
  /risk-register/assignments:
    post:
      operationId: assignRiskRegisterTeam
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskAssignmentInput" }
      responses:
        "200":
          description: Champion and owner assignment saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskMutationResponse" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /medical-underwriting/files/{fileNo}/uploads:
    post:
      operationId: recordMedicalDocumentUpload
      parameters:
        - name: fileNo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MedicalDocumentInput" }
      responses:
        "201":
          description: Private medical document saved; AML classifications require an approved originating system
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [upload_id]
                    properties:
                      upload_id: { type: integer }
        "400":
          description: Invalid document or classification metadata
        "403":
          description: Medical account or assigned-user permission required
  /business/aml/originating-systems:
    get:
      operationId: getAmlOriginatingSystems
      responses:
        "200":
          description: Authenticated staff catalog verified from the updated legacy AML writers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmlOriginatingSystemsResponse" }
  /business/allocated/{fileNo}/uploads:
    parameters:
      - name: fileNo
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listAllocatedDocumentUploads
      responses:
        "200":
          description: Private document metadata for the assigned user or SuperAdmin
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AllocatedDocumentUpload" }
        "403":
          description: Not assigned to this file
    post:
      operationId: recordAllocatedDocumentUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllocatedDocumentInput" }
      responses:
        "201":
          description: Document classification saved without changing original uploads
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [upload_id]
                    properties:
                      upload_id: { type: integer }
        "400":
          description: Invalid document metadata or unapproved originating system
        "403":
          description: Not assigned to this file
        "409":
          description: Allocation changed before the upload could be saved
components:
  schemas:
    GiLevel:
      type: string
      enum: [BRANCH, UNIT]
    GiNodeStatus:
      type: string
      enum: [PENDING, ACTIVE, INACTIVE]
    GiNode:
      type: object
      required: [id,code,name,level,status,parent_id,parent_name,manager_id,manager_name,available,version,source_reference_id,source_parent_code]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        level: { $ref: "#/components/schemas/GiLevel" }
        status: { $ref: "#/components/schemas/GiNodeStatus" }
        parent_id: { type: [integer, "null"] }
        parent_name: { type: [string, "null"] }
        manager_id: { type: [integer, "null"] }
        manager_name: { type: [string, "null"] }
        available: { type: boolean }
        version: { type: integer }
        source_reference_id: { type: [integer, "null"] }
        source_parent_code: { type: [string, "null"] }
    GiNodeInput:
      type: object
      required: [id,version,code,name,level,status,parent_id,manager_id,reason]
      properties:
        id: { type: [integer, "null"], minimum: 1 }
        version: { type: integer, minimum: 0 }
        code: { type: string, pattern: '^[A-Za-z0-9_-]{1,50}$' }
        name: { type: string, minLength: 1, maxLength: 150 }
        level: { $ref: "#/components/schemas/GiLevel" }
        status: { $ref: "#/components/schemas/GiNodeStatus" }
        parent_id: { type: [integer, "null"], minimum: 1 }
        manager_id: { type: [integer, "null"], minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    GiManager:
      type: object
      required: [id,employee_id,employee_name,emp_code,email,level,is_active,user_eligible,version,details]
      properties:
        id: { type: integer }
        employee_id: { type: integer }
        employee_name: { type: string }
        emp_code: { type: [string, "null"] }
        email: { type: [string, "null"] }
        mobile_no: { type: [string, "null"], maxLength: 50, description: Mobile number from the linked MIS user account }
        level: { $ref: "#/components/schemas/GiLevel" }
        is_active: { type: boolean }
        user_eligible: { type: boolean }
        version: { type: integer }
        details: { $ref: "#/components/schemas/GiManagerDetails" }
        source_notes: { type: array, items: { type: string } }
        source_unit_codes: { type: array, items: { type: string } }
    GiManagerInput:
      type: object
      required: [id,version,employee_id,level,is_active,details,reason]
      properties:
        id: { type: [integer, "null"], minimum: 1 }
        version: { type: integer, minimum: 0 }
        employee_id: { type: integer, minimum: 1 }
        level: { $ref: "#/components/schemas/GiLevel" }
        is_active: { type: boolean }
        details: { $ref: "#/components/schemas/GiManagerDetails" }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    GiManagerDetails:
      type: object
      required: [GI_UM_ID,GI_UM_NAME,GI_UNIT_CODE,EMAIL,HRMIS_CODE,MIS_EMP_CODE,EARN_RETAINER,NSM_CODE,VALID_FROM,VALID_TO,JOIN_DATE,RET_EFF_UPTO,RETAINER_AMT]
      properties:
        GI_UM_ID: { type: string, minLength: 1, maxLength: 50, pattern: '^[A-Za-z0-9_-]+$' }
        GI_UM_NAME: { type: string, minLength: 1, maxLength: 150 }
        GI_UNIT_CODE: { type: string, maxLength: 50 }
        EMAIL: { type: string, maxLength: 254, pattern: '^($|[^\s@]+@[^\s@]+\.[^\s@]+)$' }
        HRMIS_CODE: { type: string, maxLength: 50 }
        MIS_EMP_CODE: { type: string, maxLength: 50 }
        EARN_RETAINER: { type: boolean }
        NSM_CODE: { type: string, maxLength: 50 }
        VALID_FROM: { type: string, pattern: '^($|\d{4}-\d{2}-\d{2})$' }
        VALID_TO: { type: string, pattern: '^($|\d{4}-\d{2}-\d{2})$' }
        JOIN_DATE: { type: string, pattern: '^($|\d{4}-\d{2}-\d{2})$' }
        RET_EFF_UPTO: { type: string, pattern: '^($|\d{4}-\d{2}-\d{2})$' }
        RETAINER_AMT: { type: string, maxLength: 25, pattern: '^($|\d{1,18}(\.\d{1,6})?)$' }
    GiMedicalUnit:
      type: object
      required: [code,name,branch_name,available,gi_unit_id,gi_unit_name,mapping_version,mapping_available]
      properties:
        code: { type: string }
        name: { type: string }
        branch_name: { type: [string, "null"] }
        available: { type: boolean }
        gi_unit_id: { type: [integer, "null"] }
        gi_unit_name: { type: [string, "null"] }
        mapping_version: { type: integer }
        mapping_available: { type: boolean }
    GiManagerReference:
      type: object
      required: [id,code,name,level,enrollment_id,source_active,review_note]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        level: { $ref: "#/components/schemas/GiLevel" }
        enrollment_id: { type: [integer, "null"] }
        source_active: { type: boolean }
        review_note: { type: [string, "null"] }
    GiNationalChoice:
      type: object
      required: [code,name]
      properties:
        code: { type: string }
        name: { type: string }
    GiStructureSnapshot:
      type: object
      required: [nodes,managers,manager_users,medical_units,manager_references,nationals]
      properties:
        nodes: { type: array, items: { $ref: "#/components/schemas/GiNode" } }
        managers: { type: array, items: { $ref: "#/components/schemas/GiManager" } }
        manager_users: { type: array, items: { $ref: "#/components/schemas/SalesStaff" } }
        medical_units: { type: array, items: { $ref: "#/components/schemas/GiMedicalUnit" } }
        manager_references: { type: array, items: { $ref: "#/components/schemas/GiManagerReference" } }
        nationals: { type: array, items: { $ref: "#/components/schemas/GiNationalChoice" } }
    GiMedicalMappingSelection:
      type: object
      required: [medical_unit_code,version]
      properties:
        medical_unit_code: { type: string, pattern: '^[A-Za-z0-9_-]{1,50}$' }
        version: { type: integer, minimum: 0 }
    GiMappingInput:
      type: object
      required: [gi_unit_id,units,reason]
      properties:
        gi_unit_id: { type: integer, minimum: 1 }
        units: { type: array, minItems: 1, maxItems: 200, items: { $ref: "#/components/schemas/GiMedicalMappingSelection" } }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    GiMappingRemoval:
      type: object
      required: [medical_unit_code,version,reason]
      properties:
        medical_unit_code: { type: string, pattern: '^[A-Za-z0-9_-]{1,50}$' }
        version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    GiStructureEvent:
      type: object
      required: [id,entity_type,entity_key,actor,reason,created_at,before_details,after_details]
      properties:
        id: { type: string }
        entity_type: { type: string }
        entity_key: { type: string }
        actor: { type: string }
        reason: { type: string }
        created_at: { type: string }
        before_details: { type: [string, "null"] }
        after_details: { type: string }
    SalesMappingCatalog:
      type: string
      enum: [sales-regions, sales-branches, sales-units]
    SalesTeamManagerAssignment:
      type: object
      required: [id, catalog, organization_code, employee_id, employee_name, user_eligible, version, updated_at, updated_by]
      properties:
        id: { type: integer }
        catalog: { $ref: "#/components/schemas/SalesMappingCatalog" }
        organization_code: { type: string }
        employee_id: { type: [integer, "null"] }
        employee_name: { type: [string, "null"] }
        user_eligible: { type: boolean }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
    SalesMappingOrganization:
      type: object
      required: [catalog, code, name, level, region_code, region_name, branch_code, branch_name, is_active, eligible, issues, hierarchy_version, source_reference]
      properties:
        catalog: { $ref: "#/components/schemas/SalesMappingCatalog" }
        code: { type: string }
        name: { type: string }
        level: { type: string, enum: [REGION, BRANCH, UNIT] }
        region_code: { type: [string, "null"] }
        region_name: { type: [string, "null"] }
        branch_code: { type: [string, "null"] }
        branch_name: { type: [string, "null"] }
        is_active: { type: boolean }
        eligible: { type: boolean }
        issues: { type: array, items: { type: string } }
        hierarchy_version: { type: string }
        source_reference: { type: boolean }
    SalesManagerMappingSnapshot:
      type: object
      required: [organizations, users, assignments]
      properties:
        organizations: { type: array, items: { $ref: "#/components/schemas/SalesMappingOrganization" } }
        users: { type: array, items: { $ref: "#/components/schemas/SalesStaff" } }
        assignments: { type: array, items: { $ref: "#/components/schemas/SalesTeamManagerAssignment" } }
    SalesManagerMappingInput:
      type: object
      required: [catalog, organization_code, employee_id, expected_version, hierarchy_version]
      properties:
        catalog: { $ref: "#/components/schemas/SalesMappingCatalog" }
        organization_code: { type: string, minLength: 1, maxLength: 50 }
        employee_id: { type: [integer, "null"], minimum: 1 }
        expected_version: { type: integer, minimum: 0 }
        hierarchy_version: { type: string, pattern: "^[a-f0-9]{64}$" }
        note: { type: string, maxLength: 1000 }
        move_from: { $ref: "#/components/schemas/SalesManagerMappingSource" }
    SalesManagerMappingSource:
      type: object
      required: [organization_code, expected_version, hierarchy_version]
      properties:
        organization_code: { type: string, minLength: 1, maxLength: 50 }
        expected_version: { type: integer, minimum: 1 }
        hierarchy_version: { type: string, pattern: "^[a-f0-9]{64}$" }
    SalesManagerMappingEvent:
      type: object
      required: [id, action, before_manager_name, after_manager_name, organization_name, region_name, branch_name, note, actor, created_at]
      properties:
        id: { type: integer }
        action: { type: string, enum: [ASSIGNED, REASSIGNED, UNASSIGNED] }
        before_manager_name: { type: [string, "null"] }
        after_manager_name: { type: [string, "null"] }
        organization_name: { type: string }
        region_name: { type: [string, "null"] }
        branch_name: { type: [string, "null"] }
        note: { type: string }
        actor: { type: string }
        created_at: { type: string, format: date-time }
        transfer_from_name: { type: [string, "null"] }
        transfer_to_name: { type: [string, "null"] }
    SalesCatalogValues:
      type: object
      additionalProperties: { type: [string, "null"] }
    SalesCatalogField:
      type: object
      required: [key, label, type, required, read_only, reference, max_length]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, email, date, decimal, integer, flag] }
        required: { type: boolean }
        read_only: { type: boolean }
        reference: { type: [string, "null"] }
        max_length: { type: integer }
    SalesCatalogDefinition:
      type: object
      required: [key, title, source_table, code_field, name_field, manager, fields]
      properties:
        key: { type: string }
        title: { type: string }
        source_table: { type: string }
        code_field: { type: string }
        name_field: { type: string }
        manager: { type: boolean }
        fields: { type: array, items: { $ref: "#/components/schemas/SalesCatalogField" } }
    SalesCatalogEntry:
      type: object
      required: [id, catalog, code, name, employee_id, is_active, version, values]
      properties:
        id: { type: integer }
        catalog: { type: string }
        code: { type: string }
        name: { type: string }
        employee_id: { type: [integer, "null"] }
        is_active: { type: boolean }
        version: { type: integer }
        values: { $ref: "#/components/schemas/SalesCatalogValues" }
        source_reference: { type: boolean }
        organization_choice: { type: boolean, description: "Read-only imported organizational record allowed as a relationship lookup. Does not verify or enroll a manager." }
        source_file: { type: string }
        source_issues: { type: array, items: { type: string } }
    SalesCatalogSnapshot:
      type: object
      required: [definitions, entries, users, nationals, branch_managers]
      properties:
        definitions: { type: array, items: { $ref: "#/components/schemas/SalesCatalogDefinition" } }
        entries: { type: array, items: { $ref: "#/components/schemas/SalesCatalogEntry" } }
        users: { type: array, items: { $ref: "#/components/schemas/SalesStaff" } }
        nationals: { type: array, items: { $ref: "#/components/schemas/SalesNode" } }
        branch_managers: { type: array, items: { $ref: "#/components/schemas/SalesManager" } }
        manager_assignments: { type: array, items: { $ref: "#/components/schemas/SalesTeamManagerAssignment" } }
    SalesCatalogInput:
      type: object
      required: [values, employee_id, is_active]
      properties:
        values: { $ref: "#/components/schemas/SalesCatalogValues" }
        employee_id: { type: [integer, "null"], minimum: 1 }
        is_active: { type: boolean }
    SalesCatalogUpdate:
      type: object
      required: [values, employee_id, is_active, version]
      properties:
        values: { $ref: "#/components/schemas/SalesCatalogValues" }
        employee_id: { type: [integer, "null"], minimum: 1 }
        is_active: { type: boolean }
        version: { type: integer, minimum: 1 }
    SalesLevel:
      type: string
      enum: [NATIONAL, REGION, BRANCH, UNIT]
    SalesSetupSaved:
      type: object
      required: [id, version]
      properties:
        id: { type: integer }
        version: { type: integer }
    SalesStaff:
      type: object
      required: [employee_id, employee_name, username]
      properties:
        employee_id: { type: integer }
        employee_name: { type: string }
        username: { type: string }
        emp_code: { type: [string, "null"] }
        email: { type: [string, "null"] }
        mobile_no: { type: [string, "null"], maxLength: 50 }
        inactive_manager_categories:
          type: array
          items: { $ref: "#/components/schemas/SalesLevel" }
        user_eligible: { type: boolean }
        eligibility_note: { type: [string, "null"] }
    SalesManagerDetails:
      type: object
      required: [code, name, email, hrmis_code, mobile_no, h_tax, mis_emp_code, valid_from, valid_to]
      properties:
        code: { type: string, minLength: 1, maxLength: 50, pattern: "^[A-Za-z0-9_-]+$" }
        name: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, maxLength: 254, pattern: "^($|[^\\s@]+@[^\\s@]+\\.[^\\s@]+)$" }
        hrmis_code: { type: string, maxLength: 50 }
        mobile_no: { type: string, maxLength: 50 }
        h_tax: { type: string, maxLength: 16, pattern: "^($|(0|[1-9][0-9]{0,8})(\\.[0-9]{1,6})?)$" }
        mis_emp_code: { type: string, minLength: 1, maxLength: 50 }
        valid_from: { type: string, pattern: "^($|\\d{4}-\\d{2}-\\d{2})$" }
        valid_to: { type: string, pattern: "^($|\\d{4}-\\d{2}-\\d{2})$" }
    SalesManager:
      type: object
      required: [id, employee_id, level, is_active, version, employee_name, username, user_eligible]
      properties:
        id: { type: integer }
        employee_id: { type: integer }
        level: { $ref: "#/components/schemas/SalesLevel" }
        is_active: { type: boolean }
        version: { type: integer }
        employee_name: { type: string }
        username: { type: string }
        emp_code: { type: [string, "null"] }
        account_email: { type: [string, "null"] }
        user_eligible: { type: boolean }
        details:
          oneOf:
            - { $ref: "#/components/schemas/SalesManagerDetails" }
            - { type: "null" }
    OrganisationNode:
      allOf:
        - { $ref: "#/components/schemas/SalesNode" }
        - type: object
